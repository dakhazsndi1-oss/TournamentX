<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090f1a">
<title>TournamentX V5</title>
<style>
:root { 
    --bg: #090f1a; --card: #151e32; --line: #2a3b5c; --text: #f8fafc; 
    --muted: #94a3b8; --blue: #3b82f6; --green: #10b981; --red: #ef4444; --gold: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
.app { max-width: 800px; margin: auto; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }

/* Header */
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.brand p { color: var(--muted); font-size: 13px; }

/* Panels & Cards */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
.section-title span { color: var(--muted); font-size: 12px; font-weight: 500; }

/* Inputs & Buttons */
input, select { 
    width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); 
    background: #0f172a; color: white; font-size: 16px; outline: none; transition: 0.2s; margin-bottom: 12px;
}
input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
.btn { 
    width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; 
    color: white; background: var(--blue); cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
}
.btn:active { transform: scale(0.98); }
.btn.green { background: var(--green); } .btn.red { background: var(--red); } .btn.secondary { background: #334155; } .btn.gold { background: var(--gold); color: #000; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

/* Bottom Nav */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(21, 30, 50, 0.9); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); z-index: 100;
}
.nav-item {
    background: none; border: none; color: var(--muted); font-size: 11px; font-weight: 600; 
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; cursor: pointer; transition: 0.2s;
}
.nav-item.active { color: var(--blue); }
.nav-icon { font-size: 20px; }

/* Dashboard Stats */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: #0f172a; border-radius: 12px; padding: 16px; text-align: center; border: 1px solid var(--line); }
.stat-card h4 { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.stat-card p { font-size: 24px; font-weight: 800; }

/* List Items (Players & Matches) */
.list-item { 
    display: flex; justify-content: space-between; align-items: center; 
    padding: 12px 16px; background: #0f172a; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; 
}
.player-name { font-weight: 600; font-size: 15px; }
.btn-icon { background: none; border: none; color: var(--muted); font-size: 20px; padding: 4px 8px; cursor: pointer; }
.btn-icon:hover { color: var(--red); }

/* Matches */
.match-card { background: #0f172a; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
.match-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 16px; font-weight: 600; text-transform: uppercase; }
.match-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.team { flex: 1; font-weight: 700; font-size: 15px; text-align: center; }
.score-inputs { display: flex; align-items: center; gap: 8px; }
.score-inputs input { width: 54px; height: 54px; margin: 0; text-align: center; font-size: 22px; font-weight: 800; padding: 0; border-radius: 10px; }
.result-badge { text-align: center; font-size: 13px; font-weight: bold; color: var(--green); margin-top: 16px; padding: 8px; background: #10b98115; border-radius: 8px; }

/* Tables */
.table-container { overflow-x: auto; margin: 0 -20px; padding: 0 20px; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; min-width: 600px; }
th, td { padding: 12px 6px; text-align: center; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
th { color: var(--muted); font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
th:first-child, td:first-child { text-align: center; width: 36px; }
th:nth-child(2), td:nth-child(2) { text-align: left; font-weight: 600; }
.rank-1 { color: var(--gold); font-weight: 800; }
.rank-badge { font-size: 15px; }
.positive-gd { color: var(--green); font-weight: 600; }
.negative-gd { color: var(--red); font-weight: 600; }

/* Clean Minimal Knockout Bracket Style */
.bracket-scroll { display: flex; gap: 36px; overflow-x: auto; padding: 10px 0 20px; margin: 0 -20px; padding: 10px 20px; -webkit-overflow-scrolling: touch; }
.bracket-col { min-width: 210px; display: flex; flex-direction: column; justify-content: space-around; gap: 20px; }
.bracket-col h4 { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }

.bracket-match { 
    background: #ffffff; 
    border-radius: 14px; 
    overflow: hidden; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
    border: 1px solid #e2e8f0; 
    position: relative;
}
.bracket-team { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 10px 14px; 
    font-size: 13px; 
    font-weight: 600; 
    color: #1e293b; 
    background: #ffffff;
    cursor: pointer;
    user-select: none;
}
.bracket-team:first-child { border-bottom: 1px solid #f1f5f9; }
.bracket-team .player-info { display: flex; align-items: center; gap: 8px; color: #334155; }
.bracket-team .player-info .avatar { color: #94a3b8; font-size: 14px; }
.bracket-team .player-info .rank-num { color: #94a3b8; font-size: 12px; font-weight: 500; }
.bracket-team.bye { color: #94a3b8; justify-content: center; font-weight: 500; font-size: 12px; letter-spacing: 1px; cursor: default; }

.bracket-team .radio-dot { 
    width: 16px; 
    height: 16px; 
    border-radius: 50%; 
    border: 2px solid #cbd5e1; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    flex-shrink: 0;
}
.bracket-team.winner .radio-dot { 
    border-color: #0f172a; 
    background: #0f172a; 
}
.bracket-team.winner .radio-dot::after { 
    content: ""; 
    width: 6px; 
    height: 6px; 
    background: #ffffff; 
    border-radius: 50%; 
}
.bracket-match .crown-icon {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    z-index: 2;
}

/* Utilities */
.hidden { display: none !important; }
.empty-state { text-align: center; padding: 30px 20px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="app">
    <header>
        <div class="brand">
            <h1>TournamentX</h1>
            <p>by dakhaz_dilovan</p>
        </div>
    </header>

    <!-- Setup Tab -->
    <section id="tab-setup" class="panel">
        <h2 class="section-title">1. Tournament Details</h2>
        <input id="nameInput" placeholder="Tournament Name" value="My Tournament">
        <select id="format" onchange="toggleFormat()">
            <option value="rr">Round Robin (League)</option>
            <option value="ko">Knockout (Bracket)</option>
            <option value="group">Group Stage + Knockout</option>
        </select>
        
        <div id="groupSettings" class="hidden">
            <select id="groups">
                <option value="2">2 Groups</option>
                <option value="3">3 Groups</option>
                <option value="4">4 Groups</option>
            </select>
            <select id="qualifiers">
                <option value="1">1 Qualifier per group</option>
                <option value="2">2 Qualifiers per group</option>
            </select>
        </div>

        <h2 class="section-title" style="margin-top: 24px;">2. Player Roster <span id="playerCount">0 Players</span></h2>
        <div class="btn-row" style="margin-bottom: 12px;">
            <input id="playerInput" placeholder="Player Name" style="margin:0;">
            <button class="btn" style="width: 80px;" onclick="addPlayer()">Add</button>
        </div>
        <div id="playersArea" style="margin-bottom: 20px;"></div>

        <button class="btn green" onclick="generate()">🚀 Generate Tournament</button>
    </section>

    <!-- Matches Tab -->
    <section id="tab-matches" class="hidden">
        <div class="panel" style="margin-bottom:12px; padding:12px;">
            <button class="btn gold" onclick="exportMatchesAsImage()">📸 Save Matches as Picture (PNG)</button>
        </div>
        <div id="matchesArea"></div>
    </section>

    <!-- Standings / Bracket Tab -->
    <section id="tab-standings" class="hidden">
        <div class="panel" style="margin-bottom:12px; padding:12px;">
            <button class="btn gold" onclick="exportStandingsAsImage()">📸 Save Standings as Picture (PNG)</button>
        </div>
        <div class="panel" id="groupsAreaWrapper">
            <h2 class="section-title">Standings</h2>
            <div id="standingsArea"></div>
            <div id="groupsArea"></div>
        </div>
        <div class="panel hidden" id="bracketAreaWrapper">
            <h2 class="section-title">Bracket</h2>
            <div id="bracketArea"></div>
        </div>
    </section>

    <!-- Dashboard Tab -->
    <section id="tab-dash" class="hidden">
        <div class="stats-grid">
            <div class="stat-card"><h4>Players</h4><p id="sPlayers">0</p></div>
            <div class="stat-card"><h4>Progress</h4><p id="sProgress">0%</p></div>
        </div>
        <div class="panel">
            <h2 class="section-title">Recent Matches</h2>
            <div id="latestMatches"></div>
        </div>
    </section>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="nav('tab-setup', this)">
        <span class="nav-icon">⚙️</span><span>Setup</span>
    </button>
    <button class="nav-item" onclick="nav('tab-matches', this)">
        <span class="nav-icon">⚔️</span><span>Matches</span>
    </button>
    <button class="nav-item" onclick="nav('tab-standings', this)">
        <span class="nav-icon">🏆</span><span>Standings</span>
    </button>
    <button class="nav-item" onclick="nav('tab-dash', this)">
        <span class="nav-icon">🏠</span><span>Dash</span>
    </button>
</nav>

<script>
const KEY = "tournamentx_v5_pro";
let state = { name: "My Tournament", format: "rr", players: [], matches: [], groups: [], knockout: [], stage: "setup" };

function uid() { return Math.random().toString(36).substr(2, 9); }
function esc(x) { return String(x || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m])); }

function getRankBadge(index) {
    if (index === 0) return '🥇';
    if (index === 1) return '🥈';
    if (index === 2) return '🥉';
    return `${index + 1}.`;
}

function syncName() {
    const nameInp = document.getElementById("nameInput");
    if (nameInp && nameInp.value.trim()) {
        state.name = nameInp.value.trim();
    }
}

function save() { 
    localStorage.setItem(KEY, JSON.stringify(state)); 
}

function load() { try { let x = JSON.parse(localStorage.getItem(KEY)); if (x) state = { ...state, ...x }; } catch (e) {} }

function nav(id, btn) {
    syncName();
    document.querySelectorAll("body > .app > section").forEach(x => x.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
    document.querySelectorAll(".nav-item").forEach(x => x.classList.remove("active"));
    if(btn) btn.classList.add("active");
    render();
}

function toggleFormat() {
    const f = document.getElementById("format").value;
    document.getElementById("groupSettings").classList.toggle("hidden", f !== "group");
}

function addPlayer() {
    syncName();
    let inp = document.getElementById("playerInput"), name = inp.value.trim();
    if (!name) return;
    if (state.matches.length || state.knockout.length) {
        if (!confirm("Adding a player will reset active match progress. Continue?")) return;
        state.matches = []; state.knockout = []; state.groups = [];
    }
    state.players.push({ id: uid(), name, played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 });
    inp.value = ""; save(); render();
}
document.getElementById("playerInput").addEventListener("keydown", e => e.key === "Enter" && addPlayer());

function removePlayer(id) {
    syncName();
    if (state.matches.length || state.knockout.length) {
        if (!confirm("Removing a player will reset active match progress. Continue?")) return;
        state.matches = []; state.knockout = []; state.groups = [];
    }
    state.players = state.players.filter(p => p.id !== id);
    save(); render();
}

function resetStats() { state.players.forEach(p => Object.assign(p, { played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 })); }
function apply(m) {
    let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
    if (!a || !b) return;
    a.played++; b.played++; a.gf += m.s1; a.ga += m.s2; b.gf += m.s2; b.ga += m.s1;
    if (m.s1 > m.s2) { a.wins++; a.points += 3; b.losses++; } 
    else if (m.s2 > m.s1) { b.wins++; b.points += 3; a.losses++; } 
    else { a.draws++; b.draws++; a.points++; b.points++; }
}
function unapply(m) {
    let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
    if (!a || !b) return;
    a.played--; b.played--; a.gf -= m.s1; a.ga -= m.s2; b.gf -= m.s2; b.ga -= m.s1;
    if (m.s1 > m.s2) { a.wins--; a.points -= 3; b.losses--; } 
    else if (m.s2 > m.s1) { b.wins--; b.points -= 3; a.losses--; } 
    else { a.draws--; b.draws--; a.points--; b.points--; }
}

function rrMatches(ids) {
    let arr = [...ids]; if (arr.length % 2) arr.push(null);
    let out = [], rounds = arr.length - 1;
    for (let r = 1; r <= rounds; r++) {
        for (let i = 0; i < arr.length / 2; i++) {
            let a = arr[i], b = arr[arr.length - 1 - i];
            if (a && b) out.push({ id: uid(), round: r, p1: a, p2: b, s1: null, s2: null, done: false });
        }
        arr = [arr[0], arr[arr.length - 1], ...arr.slice(1, arr.length - 1)];
    }
    return out;
}

function createKO(ids) {
    let arr = [...ids], size = 1;
    while (size < arr.length) size *= 2;
    while (arr.length < size) arr.push(null);
    let current = [];
    for (let i = 0; i < size; i += 2) {
        let p1 = arr[i], p2 = arr[i+1];
        let m = { id: uid(), round: 1, p1, p2, s1: null, s2: null, done: false, ko: true };
        if (p1 && !p2) { m.done = true; m.s1 = 1; m.s2 = 0; m.winner = p1; }
        current.push(m);
    }
    state.knockout = current;
    advanceRound(1);
}

function selectKOWinner(matchId, winnerPlayerId) {
    let m = state.knockout.find(x => x.id === matchId);
    if (!m || !winnerPlayerId || !m.p1 || !m.p2) return;
    
    if (winnerPlayerId === m.p1) {
        m.s1 = 1; m.s2 = 0;
    } else {
        m.s1 = 0; m.s2 = 1;
    }
    m.done = true;
    m.winner = winnerPlayerId;

    advanceRound(m.round);
    save();
    render();
}

function advanceRound(round) {
    let sameRound = state.knockout.filter(x => x.round === round);
    if (!sameRound.every(x => x.done)) return;

    let winners = sameRound.map(x => x.winner).filter(x => x != null);
    if (winners.length <= 1) return;

    let nextRound = round + 1;
    let existingNext = state.knockout.filter(x => x.round === nextRound);

    if (!existingNext.length) {
        let next = [];
        for (let i = 0; i < winners.length; i += 2) {
            let p1 = winners[i] || null;
            let p2 = winners[i + 1] || null;
            let m = { id: uid(), round: nextRound, p1, p2, s1: null, s2: null, done: false, ko: true };
            if (p1 && !p2) { m.done = true; m.s1 = 1; m.s2 = 0; m.winner = p1; }
            next.push(m);
        }
        state.knockout.push(...next);
        advanceRound(nextRound);
    }
}

function generate() {
    if (state.players.length < 2) return alert("Please add at least 2 players to start.");
    if ((state.matches.length || state.knockout.length) && !confirm("Generate new matches and overwrite existing progress?")) return;
    
    syncName();
    state.format = document.getElementById("format").value;
    state.groups = []; state.matches = []; state.knockout = []; resetStats();

    if (state.format === "rr") { state.matches = rrMatches(state.players.map(p => p.id)); }
    else if (state.format === "ko") { createKO(state.players.map(p => p.id)); }
    else {
        let g = +document.getElementById("groups").value, q = +document.getElementById("qualifiers").value;
        if (g > state.players.length) g = Math.floor(state.players.length / 2);
        let shuffled = [...state.players].sort(() => Math.random() - 0.5);
        state.groups = Array.from({ length: g }, (_, i) => ({ name: String.fromCharCode(65 + i), ids: [] }));
        shuffled.forEach((p, i) => state.groups[i % g].ids.push(p.id));
        state.groups.forEach(gr => { gr.matches = rrMatches(gr.ids); state.matches.push(...gr.matches); });
        state.qualifiers = q;
    }
    save(); nav('tab-matches', document.querySelectorAll('.nav-item')[1]);
}

function score(id, isKO) {
    let list = isKO ? state.knockout : state.matches, m = list.find(x => x.id === id);
    if (!m) return;
    let input1 = document.getElementById("a" + id);
    let input2 = document.getElementById("b" + id);
    if (!input1 || !input2 || input1.value === "" || input2.value === "") return alert("Enter both scores.");
    
    let s1 = +input1.value, s2 = +input2.value;
    if (isKO && s1 === s2) return alert("No draws in knockout stage.");

    if (m.done && !isKO) unapply(m);
    m.s1 = s1; m.s2 = s2; m.done = true;
    
    if (!isKO) {
        apply(m);
    } else {
        m.winner = s1 > s2 ? m.p1 : m.p2;
        advanceRound(m.round);
    }
    
    save(); render();
}

function sorted() { 
    return [...state.players].sort((a, b) => 
        b.points - a.points || 
        (b.gf - b.ga) - (a.gf - a.ga) || 
        b.gf - a.gf || 
        a.name.localeCompare(b.name)
    ); 
}

function renderMatch(m, isKO) {
    let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
    if (!a && !b) return "";
    let res = m.done ? (m.s1 === m.s2 ? "Draw" : `${(m.s1 > m.s2 ? a : b)?.name || 'Winner'} Won`) : "";
    
    return `<div class="match-card">
        <div class="match-header"><span>Round ${m.round}</span><span>${m.done ? "✅" : "⏳"}</span></div>
        <div class="match-row">
            <div class="team">${esc(a ? a.name : 'BYE')}</div>
            <div class="score-inputs">
                <input id="a${m.id}" type="number" inputmode="numeric" value="${m.s1 ?? ""}">
                <span>-</span>
                <input id="b${m.id}" type="number" inputmode="numeric" value="${m.s2 ?? ""}">
            </div>
            <div class="team">${esc(b ? b.name : 'BYE')}</div>
        </div>
        <button class="btn secondary" style="margin-top:16px" onclick="score('${m.id}', ${isKO ? 'true' : 'false'})">Save Score</button>
        ${res ? `<div class="result-badge">${res}</div>` : ""}
    </div>`;
}

function buildTableHTML(playerList, qualifierCut = 0) {
    return `<div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>P</th>
                    <th>W</th>
                    <th>D</th>
                    <th>L</th>
                    <th>GS</th>
                    <th>GA</th>
                    <th>GD</th>
                    <th>PTS</th>
                </tr>
            </thead>
            <tbody>
                ${playerList.map((p, i) => {
                    let gd = p.gf - p.ga;
                    let gdClass = gd > 0 ? 'positive-gd' : (gd < 0 ? 'negative-gd' : '');
                    let gdStr = gd > 0 ? `+${gd}` : gd;
                    let rowStyle = (qualifierCut && i < qualifierCut) ? 'background:#10b98115' : '';
                    return `<tr style="${rowStyle}">
                        <td class="rank-badge">${getRankBadge(i)}</td>
                        <td class="${i===0 ? 'rank-1' : ''}">${esc(p.name)}</td>
                        <td>${p.played}</td>
                        <td>${p.wins}</td>
                        <td>${p.draws}</td>
                        <td>${p.losses}</td>
                        <td>${p.gf}</td>
                        <td>${p.ga}</td>
                        <td class="${gdClass}">${gdStr}</td>
                        <td><b>${p.points}</b></td>
                    </tr>`;
                }).join("")}
            </tbody>
        </table>
    </div>`;
}

function render() {
    document.getElementById("nameInput").value = state.name || "";
    document.getElementById("nameInput").oninput = syncName;
    document.getElementById("format").value = state.format || "rr";
    toggleFormat();

    document.getElementById("playerCount").textContent = `${state.players.length} Players`;
    document.getElementById("playersArea").innerHTML = state.players.map(p => 
        `<div class="list-item"><span class="player-name">${esc(p.name)}</span><button class="btn-icon" onclick="removePlayer('${p.id}')">×</button></div>`
    ).join("") || '<div class="empty-state">No players added yet. Add players above.</div>';

    let mList = state.format === "ko" ? state.knockout : state.matches;
    document.getElementById("matchesArea").innerHTML = mList.length ? mList.map(m => renderMatch(m, state.format === "ko")).join("") : '<div class="empty-state panel">Add players & click "Generate Tournament" on the Setup page to view matches.</div>';

    let allM = [...state.matches, ...state.knockout], played = allM.filter(m => m.done).length;
    document.getElementById("sPlayers").textContent = state.players.length;
    document.getElementById("sProgress").textContent = allM.length ? Math.round(played / allM.length * 100) + "%" : "0%";
    document.getElementById("latestMatches").innerHTML = allM.filter(m => m.done).slice(-3).map(m => {
        let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
        return `<div class="list-item" style="font-size:13px"><span style="flex:1">${esc(a?.name || 'BYE')}</span><b style="color:var(--gold); margin:0 12px">${m.s1}-${m.s2}</b><span style="flex:1; text-align:right">${esc(b?.name || 'BYE')}</span></div>`;
    }).join("") || '<div class="empty-state" style="padding: 20px 0;">No results yet.</div>';

    const stdWrap = document.getElementById("standingsArea");
    const grpWrap = document.getElementById("groupsArea");
    const brkWrap = document.getElementById("bracketAreaWrapper");
    
    stdWrap.innerHTML = ""; grpWrap.innerHTML = ""; brkWrap.classList.add("hidden");

    if (state.format === "rr") {
        stdWrap.innerHTML = buildTableHTML(sorted());
    } else if (state.format === "group") {
        grpWrap.innerHTML = state.groups.map(g => {
            let ps = sorted().filter(p => g.ids.includes(p.id));
            return `<h3 style="margin: 20px 0 10px; font-size: 14px; color: var(--muted)">Group ${g.name}</h3>` + buildTableHTML(ps, state.qualifiers);
        }).join("");
        
        if (state.groups.length && state.matches.every(m => m.done) && !state.knockout.length) {
            grpWrap.innerHTML += `<button class="btn green" style="margin-top:20px" onclick="makeGroupKO()">Start Knockout Stage</button>`;
        }
    }
    
    if (state.format === "ko" || state.knockout.length > 0) {
        brkWrap.classList.remove("hidden");
        let rounds = {}; 
        state.knockout.forEach(m => (rounds[m.round] ??= []).push(m));
        let maxRound = Math.max(...Object.keys(rounds).map(Number));

        document.getElementById("bracketArea").innerHTML = `<div class="bracket-scroll">${Object.keys(rounds).map(r => `
            <div class="bracket-col">
            <h4>Round ${r}</h4>
            ${rounds[r].map(m => {
                let a = state.players.find(p => p.id === m.p1);
                let b = state.players.find(p => p.id === m.p2);
                let idxA = state.players.findIndex(p => p.id === m.p1) + 1;
                let idxB = state.players.findIndex(p => p.id === m.p2) + 1;
                let isFinal = Number(r) === maxRound && m.done;

                if (!m.p2 && m.p1) {
                    return `<div class="bracket-match">
                        <div class="bracket-team winner">
                            <div class="player-info"><span class="avatar">👤</span><span class="rank-num">${idxA}</span><span>${esc(a.name)}</span></div>
                            <div class="radio-dot"></div>
                        </div>
                        <div class="bracket-team bye">BYE</div>
                    </div>`;
                }

                return `<div class="bracket-match">
                    ${isFinal ? `<div class="crown-icon">👑</div>` : ''}
                    <div class="bracket-team ${m.done && m.winner === m.p1 ? 'winner' : ''}" onclick="selectKOWinner('${m.id}', '${m.p1}')">
                        <div class="player-info"><span class="avatar">👤</span><span class="rank-num">${idxA || ''}</span><span>${a ? esc(a.name) : 'TBD'}</span></div>
                        <div class="radio-dot"></div>
                    </div>
                    <div class="bracket-team ${m.done && m.winner === m.p2 ? 'winner' : ''}" onclick="selectKOWinner('${m.id}', '${m.p2}')">
                        <div class="player-info"><span class="avatar">👤</span><span class="rank-num">${idxB || ''}</span><span>${b ? esc(b.name) : 'TBD'}</span></div>
                        <div class="radio-dot"></div>
                    </div>
                </div>`;
            }).join("")}</div>
        `).join("")}</div>`;
    }
}

function generateGraphicImage(title, items, filename) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const width = 850;
    const padding = 40;
    const itemHeight = 44;
    const height = 180 + (items.length * itemHeight);

    canvas.width = width;
    canvas.height = height;

    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, "#090f1a");
    grad.addColorStop(1, "#151e32");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = "#f59e0b";
    ctx.font = "bold 28px sans-serif";
    ctx.fillText(state.name || "TournamentX", padding, 60);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "16px sans-serif";
    ctx.fillText(title + " • " + new Date().toLocaleDateString(), padding, 90);

    ctx.strokeStyle = "#2a3b5c";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding, 110);
    ctx.lineTo(width - padding, 110);
    ctx.stroke();

    let y = 150;
    items.forEach((item, index) => {
        ctx.fillStyle = index % 2 === 0 ? "#0f172a" : "#1e293b";
        if (ctx.roundRect) {
            ctx.beginPath();
            ctx.roundRect(padding, y - 28, width - (padding * 2), 36, 8);
            ctx.fill();
        } else {
            ctx.fillRect(padding, y - 28, width - (padding * 2), 36);
        }

        ctx.fillStyle = "#f8fafc";
        ctx.font = "15px sans-serif";
        ctx.fillText(item.left, padding + 15, y);

        ctx.fillStyle = "#3b82f6";
        ctx.font = "bold 15px monospace";
        ctx.textAlign = "right";
        ctx.fillText(item.right, width - padding - 15, y);
        ctx.textAlign = "left";

        y += itemHeight;
    });

    const link = document.createElement("a");
    link.download = filename;
    link.href = canvas.toDataURL("image/png");
    link.click();
}

function exportMatchesAsImage() {
    let list = state.format === "ko" ? state.knockout : state.matches;
    if (!list.length) return alert("No matches available to export.");

    let items = list.map(m => {
        let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
        let scoreText = m.done ? `${m.s1} - ${m.s2}` : "VS (Pending)";
        return { left: `Round ${m.round}: ${a?.name || "TBD"} vs ${b?.name || "TBD"}`, right: scoreText };
    });

    generateGraphicImage("Match Results", items, `${state.name.replace(/\s+/g, '_')}_Matches.png`);
}

function exportStandingsAsImage() {
    let arr = sorted();
    if (!arr.length) return alert("No standings data available.");

    let items = arr.map((p, i) => {
        let gd = p.gf - p.ga;
        let gdStr = gd > 0 ? `+${gd}` : gd;
        return {
            left: `${getRankBadge(i)} ${p.name}`,
            right: `P:${p.played} W:${p.wins} D:${p.draws} L:${p.losses} GS:${p.gf} GA:${p.ga} GD:${gdStr} PTS:${p.points}`
        };
    });

    generateGraphicImage("Standings & Leaderboard", items, `${state.name.replace(/\s+/g, '_')}_Standings.png`);
}

function makeGroupKO() {
    let q = state.qualifiers || 2;
    let ids = state.groups.flatMap(g => sorted().filter(p => g.ids.includes(p.id)).slice(0, q).map(p => p.id));
    createKO(ids); save(); render();
}

load(); render();
</script>
