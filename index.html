<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#090d16">
<title>TournamentX V5</title>
<style>
:root { 
    --bg: #090d16; 
    --card: #131b2e; 
    --line: #1e293b; 
    --text: #f8fafc; 
    --muted: #94a3b8; 
    --blue: #3b82f6; 
    --green: #22c55e; 
    --red: #ef4444; 
    --gold: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(80px + env(safe-area-inset-bottom)); font-size: 13px; }
.app { max-width: 750px; margin: auto; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }

/* Header */
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 4px; }
.brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #60a5fa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.brand p { color: var(--muted); font-size: 11px; margin-top: 2px; font-weight: 500; }

/* Panels & Cards */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3), 0 8px 10px -6px rgba(0,0,0,0.3); }
.section-title { font-size: 14px; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; color: #e2e8f0; letter-spacing: -0.2px; }
.section-title span { color: var(--muted); font-size: 11px; font-weight: 500; }

/* Inputs & Buttons */
input, select { 
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); 
    background: #0b1120; color: var(--text); font-size: 13px; outline: none; transition: all 0.2s ease; margin-bottom: 10px;
}
input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); background: #0f172a; }
.btn { 
    width: 100%; border: 0; border-radius: 12px; padding: 12px 14px; font-size: 13px; font-weight: 700; 
    color: white; background: var(--blue); cursor: pointer; transition: all 0.2s ease; display: flex; justify-content: center; align-items: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}
.btn:active { transform: scale(0.98); }
.btn.green { background: var(--green); box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); } 
.btn.red { background: var(--red); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); } 
.btn.secondary { background: #334155; box-shadow: none; } 
.btn.gold { background: var(--gold); color: #090d16; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); font-weight: 800; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

/* Bottom Nav */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(19, 27, 46, 0.85); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); z-index: 100;
}
.nav-item {
    background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 600; 
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 12px; cursor: pointer; transition: 0.2s; border-radius: 10px;
}
.nav-item.active { color: var(--blue); background: rgba(59, 130, 246, 0.1); }
.nav-icon { font-size: 18px; }

/* List Items (Players & Matches) */
.list-item { 
    display: flex; justify-content: space-between; align-items: center; 
    padding: 12px 14px; background: #0b1120; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; font-size: 13px;
}
.player-name { font-weight: 600; font-size: 13px; color: #f1f5f9; }
.btn-icon { background: none; border: none; color: var(--muted); font-size: 18px; padding: 2px 8px; cursor: pointer; border-radius: 6px; transition: 0.2s; }
.btn-icon:hover { color: var(--red); background: rgba(239, 68, 68, 0.1); }

/* Matches */
.match-card { background: #0b1120; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.match-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.match-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.team { flex: 1; font-weight: 700; font-size: 13px; text-align: center; color: #f8fafc; }
.score-inputs { display: flex; align-items: center; gap: 8px; }
.score-inputs input { width: 48px; height: 48px; margin: 0; text-align: center; font-size: 18px; font-weight: 800; padding: 0; border-radius: 10px; background: #131b2e; border-color: var(--line); color: var(--text); }
.result-badge { text-align: center; font-size: 12px; font-weight: bold; color: var(--green); margin-top: 12px; padding: 8px; background: rgba(34, 197, 94, 0.1); border-radius: 8px; border: 1px solid rgba(34, 197, 94, 0.2); }

/* Tables */
.table-container { overflow-x: auto; margin: 0 -18px; padding: 0 18px; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; min-width: 550px; }
th, td { padding: 12px 6px; text-align: center; border-bottom: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
th { color: var(--muted); font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; }
th:first-child, td:first-child { text-align: center; width: 35px; }
th:nth-child(2), td:nth-child(2) { text-align: left; font-weight: 600; }
.rank-1 { color: var(--gold); font-weight: 800; text-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
.rank-badge { font-size: 13px; font-weight: 700; color: var(--muted); }
.positive-gd { color: var(--green); font-weight: 600; }
.negative-gd { color: var(--red); font-weight: 600; }

/* Utilities */
.hidden { display: none !important; }
.empty-state { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 13px; font-weight: 500; }
</style>
</head>
<body>
<div class="app">
    <header>
        <div class="brand">
            <h1>TournamentX</h1>
            <p>by dakhaz_dilovan</p>
        </div>
    </header>

    <!-- Setup Tab -->
    <section id="tab-setup" class="panel">
        <h2 class="section-title">1. Tournament Details</h2>
        <input id="nameInput" placeholder="Tournament Name" value="My Tournament">
        <select id="format" class="hidden">
            <option value="rr" selected>Round Robin (League)</option>
        </select>

        <h2 class="section-title" style="margin-top: 20px;">2. Player Roster <span id="playerCount">0 Players</span></h2>
        <div class="btn-row" style="margin-bottom: 12px;">
            <input id="playerInput" placeholder="Player Name" style="margin:0;">
            <button class="btn" style="width: 80px;" onclick="addPlayer()">Add</button>
        </div>
        <div id="playersArea" style="margin-bottom: 16px;"></div>

        <button class="btn green" onclick="generate()">🚀 Generate Tournament</button>
    </section>

    <!-- Matches Tab -->
    <section id="tab-matches" class="hidden">
        <div class="panel" style="margin-bottom:12px; padding:12px;">
            <button class="btn gold" onclick="exportMatchesAsImage()">📸 Save Matches as Picture (PNG)</button>
        </div>
        <div id="matchesArea"></div>
    </section>

    <!-- Standings Tab -->
    <section id="tab-standings" class="hidden">
        <div class="panel" style="margin-bottom:12px; padding:12px;">
            <button class="btn gold" onclick="exportStandingsAsImage()">📸 Save Standings as Picture (PNG)</button>
        </div>
        <div class="panel" id="groupsAreaWrapper">
            <h2 class="section-title">Standings</h2>
            <div id="standingsArea"></div>
        </div>
    </section>
</div>

<nav class="bottom-nav">
    <button class="nav-item active" onclick="nav('tab-setup', this)">
        <span class="nav-icon">⚙️</span><span>Setup</span>
    </button>
    <button class="nav-item" onclick="nav('tab-matches', this)">
        <span class="nav-icon">⚔️</span><span>Matches</span>
    </button>
    <button class="nav-item" onclick="nav('tab-standings', this)">
        <span class="nav-icon">🏆</span><span>Standings</span>
    </button>
</nav>

<script>
const KEY = "tournamentx_v5_pro_rr_light";
let state = { name: "My Tournament", format: "rr", players: [], matches: [], stage: "setup" };

function uid() { return Math.random().toString(36).substr(2, 9); }
function esc(x) { return String(x || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m])); }

function getRankBadge(index) {
    return `${index + 1}.`;
}

function syncName() {
    const nameInp = document.getElementById("nameInput");
    if (nameInp && nameInp.value.trim()) {
        state.name = nameInp.value.trim();
    }
}

function save() { 
    localStorage.setItem(KEY, JSON.stringify(state)); 
}

function load() { try { let x = JSON.parse(localStorage.getItem(KEY)); if (x) state = { ...state, ...x }; } catch (e) {} }

function nav(id, btn) {
    syncName();
    document.querySelectorAll("body > .app > section").forEach(x => x.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
    document.querySelectorAll(".nav-item").forEach(x => x.classList.remove("active"));
    if(btn) btn.classList.add("active");
    render();
}

function addPlayer() {
    syncName();
    let inp = document.getElementById("playerInput"), name = inp.value.trim();
    if (!name) return;
    if (state.matches.length) {
        if (!confirm("Adding a player will reset active match progress. Continue?")) return;
        state.matches = [];
    }
    state.players.push({ id: uid(), name, played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 });
    inp.value = ""; save(); render();
}
document.getElementById("playerInput").addEventListener("keydown", e => e.key === "Enter" && addPlayer());

function removePlayer(id) {
    syncName();
    if (state.matches.length) {
        if (!confirm("Removing a player will reset active match progress. Continue?")) return;
        state.matches = [];
    }
    state.players = state.players.filter(p => p.id !== id);
    save(); render();
}

function resetStats() { state.players.forEach(p => Object.assign(p, { played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 })); }
function apply(m) {
    let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
    if (!a || !b) return;
    a.played++; b.played++; a.gf += m.s1; a.ga += m.s2; b.gf += m.s2; b.ga += m.s1;
    if (m.s1 > m.s2) { a.wins++; a.points += 3; b.losses++; } 
    else if (m.s2 > m.s1) { b.wins++; b.points += 3; a.losses++; } 
    else { a.draws++; b.draws++; a.points++; b.points++; }
}
function unapply(m) {
    let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
    if (!a || !b) return;
    a.played--; b.played--; a.gf -= m.s1; a.ga -= m.s2; b.gf -= m.s2; b.ga -= m.s1;
    if (m.s1 > m.s2) { a.wins--; a.points -= 3; b.losses--; } 
    else if (m.s2 > m.s1) { b.wins--; b.points -= 3; a.losses--; } 
    else { a.draws--; b.draws--; a.points--; b.points--; }
}

function rrMatches(ids) {
    let arr = [...ids]; if (arr.length % 2) arr.push(null);
    let out = [], rounds = arr.length - 1;
    for (let r = 1; r <= rounds; r++) {
        for (let i = 0; i < arr.length / 2; i++) {
            let a = arr[i], b = arr[arr.length - 1 - i];
            if (a && b) out.push({ id: uid(), round: r, p1: a, p2: b, s1: null, s2: null, done: false });
        }
        arr = [arr[0], arr[arr.length - 1], ...arr.slice(1, arr.length - 1)];
    }
    return out;
}

function generate() {
    if (state.players.length < 2) return alert("Please add at least 2 players to start.");
    if (state.matches.length && !confirm("Generate new matches and overwrite existing progress?")) return;
    
    syncName();
    state.format = "rr";
    state.matches = []; resetStats();

    state.matches = rrMatches(state.players.map(p => p.id));
    save(); nav('tab-matches', document.querySelectorAll('.nav-item')[1]);
}

function score(id) {
    let m = state.matches.find(x => x.id === id);
    if (!m) return;
    let input1 = document.getElementById("a" + id);
    let input2 = document.getElementById("b" + id);
    if (!input1 || !input2 || input1.value === "" || input2.value === "") return alert("Enter both scores.");
    
    let s1 = +input1.value, s2 = +input2.value;

    if (m.done) unapply(m);
    m.s1 = s1; m.s2 = s2; m.done = true;
    
    apply(m);
    
    save(); render();
}

function sorted() { 
    return [...state.players].sort((a, b) => 
        b.points - a.points || 
        (b.gf - b.ga) - (a.gf - a.ga) || 
        b.gf - a.gf || 
        a.name.localeCompare(b.name)
    ); 
}

function renderMatch(m) {
    let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
    if (!a && !b) return "";
    let res = m.done ? (m.s1 === m.s2 ? "Draw" : `${(m.s1 > m.s2 ? a : b)?.name || 'Winner'} Won`) : "";
    
    return `<div class="match-card">
        <div class="match-header"><span>Round ${m.round}</span><span>${m.done ? "✅ Completed" : "⏳ Pending"}</span></div>
        <div class="match-row">
            <div class="team">${esc(a ? a.name : 'BYE')}</div>
            <div class="score-inputs">
                <input id="a${m.id}" type="number" inputmode="numeric" value="${m.s1 ?? ""}">
                <span style="color:var(--muted); font-weight:700;">-</span>
                <input id="b${m.id}" type="number" inputmode="numeric" value="${m.s2 ?? ""}">
            </div>
            <div class="team">${esc(b ? b.name : 'BYE')}</div>
        </div>
        <button class="btn secondary" style="margin-top:14px" onclick="score('${m.id}')">Save Score</button>
        ${res ? `<div class="result-badge">${res}</div>` : ""}
    </div>`;
}

function buildTableHTML(playerList) {
    return `<div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>P</th>
                    <th>W</th>
                    <th>D</th>
                    <th>L</th>
                    <th>GS</th>
                    <th>GA</th>
                    <th>GD</th>
                    <th>PTS</th>
                </tr>
            </thead>
            <tbody>
                ${playerList.map((p, i) => {
                    let gd = p.gf - p.ga;
                    let gdClass = gd > 0 ? 'positive-gd' : (gd < 0 ? 'negative-gd' : '');
                    let gdStr = gd > 0 ? `+${gd}` : gd;
                    return `<tr>
                        <td class="rank-badge">${getRankBadge(i)}</td>
                        <td class="${i===0 ? 'rank-1' : ''}">${esc(p.name)}</td>
                        <td>${p.played}</td>
                        <td>${p.wins}</td>
                        <td>${p.draws}</td>
                        <td>${p.losses}</td>
                        <td>${p.gf}</td>
                        <td>${p.ga}</td>
                        <td class="${gdClass}">${gdStr}</td>
                        <td><b style="color:var(--blue);">${p.points}</b></td>
                    </tr>`;
                }).join("")}
            </tbody>
        </table>
    </div>`;
}

function render() {
    document.getElementById("nameInput").value = state.name || "";
    document.getElementById("nameInput").oninput = syncName;

    document.getElementById("playerCount").textContent = `${state.players.length} Players`;
    document.getElementById("playersArea").innerHTML = state.players.map(p => 
        `<div class="list-item"><span class="player-name">${esc(p.name)}</span><button class="btn-icon" onclick="removePlayer('${p.id}')">×</button></div>`
    ).join("") || '<div class="empty-state">No players added yet. Add players above.</div>';

    document.getElementById("matchesArea").innerHTML = state.matches.length ? state.matches.map(m => renderMatch(m)).join("") : '<div class="empty-state panel">Add players & click "Generate Tournament" on the Setup page to view matches.</div>';

    const stdWrap = document.getElementById("standingsArea");
    stdWrap.innerHTML = buildTableHTML(sorted());
}

function generateGraphicImage(title, items, filename) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const width = 850;
    const padding = 40;
    const itemHeight = 44;
    const height = 180 + (items.length * itemHeight);

    canvas.width = width;
    canvas.height = height;

    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, "#0b1120");
    grad.addColorStop(1, "#090d16");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = "#f59e0b";
    ctx.font = "bold 28px sans-serif";
    ctx.fillText(state.name || "TournamentX", padding, 60);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "16px sans-serif";
    ctx.fillText(title, padding, 90);

    ctx.strokeStyle = "#1e293b";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding, 110);
    ctx.lineTo(width - padding, 110);
    ctx.stroke();

    let y = 150;
    items.forEach((item, index) => {
        ctx.fillStyle = index % 2 === 0 ? "#131b2e" : "#0f172a";
        if (ctx.roundRect) {
            ctx.beginPath();
            ctx.roundRect(padding, y - 28, width - (padding * 2), 36, 8);
            ctx.fill();
        } else {
            ctx.fillRect(padding, y - 28, width - (padding * 2), 36);
        }

        ctx.fillStyle = "#f8fafc";
        ctx.font = "15px sans-serif";
        ctx.fillText(item.left, padding + 15, y);

        ctx.fillStyle = "#3b82f6";
        ctx.font = "bold 15px monospace";
        ctx.textAlign = "right";
        ctx.fillText(item.right, width - padding - 15, y);
        ctx.textAlign = "left";

        y += itemHeight;
    });

    const link = document.createElement("a");
    link.download = filename;
    link.href = canvas.toDataURL("image/png");
    link.click();
}

function exportMatchesAsImage() {
    if (!state.matches.length) return alert("No matches available to export.");

    let items = state.matches.map(m => {
        let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
        let scoreText = m.done ? `${m.s1} - ${m.s2}` : "VS (Pending)";
        return { left: `Round ${m.round}: ${a?.name || "TBD"} vs ${b?.name || "TBD"}`, right: scoreText };
    });

    generateGraphicImage("Match Results", items, `${state.name.replace(/\s+/g, '_')}_Matches.png`);
}

function exportStandingsAsImage() {
    let arr = sorted();
    if (!arr.length) return alert("No standings data available.");

    let items = arr.map((p, i) => {
        let gd = p.gf - p.ga;
        let gdStr = gd > 0 ? `+${gd}` : gd;
        return {
            left: `${getRankBadge(i)} ${p.name}`,
            right: `P:${p.played} W:${p.wins} D:${p.draws} L:${p.losses} PTS:${p.points} (GD: ${gdStr})`
        };
    });

    generateGraphicImage("Standings & Leaderboard", items, `${state.name.replace(/\s+/g, '_')}_Standings.png`);
}

load(); render();
</script>
</body>
</html>
