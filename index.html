<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f5f9">
<title>TournamentX V5</title>
<style>
:root { 
    --bg: #f1f5f9; --card: #ffffff; --line: #cbd5e1; --text: #0f172a; 
    --muted: #64748b; --blue: #2563eb; --green: #16a34a; --red: #dc2626; --gold: #d97706;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: calc(70px + env(safe-area-inset-bottom)); font-size: 13px; }
.app { max-width: 750px; margin: auto; padding: 12px; padding-top: max(12px, env(safe-area-inset-top)); }

/* Header */
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
.brand p { color: var(--muted); font-size: 11px; }

/* Panels & Cards */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.section-title span { color: var(--muted); font-size: 11px; font-weight: 500; }

/* Inputs & Buttons */
input, select { 
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); 
    background: #f8fafc; color: var(--text); font-size: 13px; outline: none; transition: 0.2s; margin-bottom: 10px;
}
input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); background: #ffffff; }
.btn { 
    width: 100%; border: 0; border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 700; 
    color: white; background: var(--blue); cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 6px;
}
.btn:active { transform: scale(0.98); }
.btn.green { background: var(--green); } .btn.red { background: var(--red); } .btn.secondary { background: #475569; } .btn.gold { background: var(--gold); color: #fff; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

/* Bottom Nav */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); z-index: 100;
}
.nav-item {
    background: none; border: none; color: var(--muted); font-size: 10px; font-weight: 600; 
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; cursor: pointer; transition: 0.2s;
}
.nav-item.active { color: var(--blue); }
.nav-icon { font-size: 18px; }

/* List Items (Players & Matches) */
.list-item { 
    display: flex; justify-content: space-between; align-items: center; 
    padding: 10px 12px; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; font-size: 13px;
}
.player-name { font-weight: 600; font-size: 13px; }
.btn-icon { background: none; border: none; color: var(--muted); font-size: 18px; padding: 2px 6px; cursor: pointer; }
.btn-icon:hover { color: var(--red); }

/* Matches */
.match-card { background: #f8fafc; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
.match-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 10px; font-weight: 600; text-transform: uppercase; }
.match-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; }
.team { flex: 1; font-weight: 700; font-size: 12px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score-inputs { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.score-inputs input { width: 38px; height: 38px; margin: 0; text-align: center; font-size: 16px; font-weight: 800; padding: 0; border-radius: 8px; background: #ffffff; }
.result-badge { text-align: center; font-size: 12px; font-weight: bold; color: var(--green); margin-top: 10px; padding: 6px; background: #dcfce7; border-radius: 6px; }

/* Tables */
.table-container { overflow-x: auto; margin: 0 -14px; padding: 0 14px; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; min-width: 500px; }
th, td { padding: 10px 4px; text-align: center; border-bottom: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
th { color: var(--muted); font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
th:first-child, td:first-child { text-align: center; width: 40px; }
th:nth-child(2), td:nth-child(2) { text-align: left; font-weight: 600; }
.positive-gd { color: var(--green); font-weight: 600; }
.negative-gd { color: var(--red); font-weight: 600; }

/* Custom Badge Graphic Circles */
.rank-circle {
    display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 11px; font-weight: 700; color: #fff;
}
.rank-1 { background: #eab308; }
.rank-2 { background: #94a3b8; }
.rank-3 { background: #f97316; }

/* Utilities */
.hidden { display: none !important; }
.empty-state { text-align: center; padding: 24px 16px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="app">
    <header>
        <div class="brand">
            <h1>TournamentX</h1>
            <p>by dakhaz_dilovan</p>
        </div>
    </header>

    <!-- Setup Tab -->
    <section id="tab-setup" class="panel">
        <h2 class="section-title">1. Tournament Details</h2>
        <input id="nameInput" placeholder="Tournament Name" value="My Tournament">
        <select id="format" class="hidden">
            <option value="rr" selected>Round Robin (League)</option>
        </select>

        <h2 class="section-title" style="margin-top: 18px;">2. Player Roster <span id="playerCount">0 Players</span></h2>
        <div class="btn-row" style="margin-bottom: 10px;">
            <input id="playerInput" placeholder="Player Name" style="margin:0;">
            <button class="btn" style="width: 70px;" onclick="addPlayer()">Add</button>
        </div>
        <div id="playersArea" style="margin-bottom: 16px;"></div>

        <button class="btn green" onclick="generate()">🚀 Generate Tournament</button>
    </section>

    <!-- Matches Tab -->
    <section id="tab-matches" class="hidden">
        <div class="panel" style="margin-bottom:10px; padding:10px;">
            <button class="btn gold" onclick="exportMatchesAsImage()">📸 Save Matches as Picture (PNG)</button>
        </div>
        <div id="matchesArea"></div>
    </section>

    <!-- Standings Tab -->
    <section id="tab-standings" class="hidden">
        <div class="panel" style="margin-bottom:10px; padding:10px;">
            <button class="btn gold" onclick="exportStandingsAsImage()">📸 Save Standings as Picture (PNG)</button>
        </div>
        <div class="panel" id="groupsAreaWrapper">
            <h2 class="section-title">Standings</h2>
            <div id="standingsArea"></div>
        </div>
    </section>
</div>

<nav class="bottom-nav" style="justify-content: space-around;">
    <button class="nav-item active" onclick="nav('tab-setup', this)">
        <span class="nav-icon">⚙️</span><span>Setup</span>
    </button>
    <button class="nav-item" onclick="nav('tab-matches', this)">
        <span class="nav-icon">⚔️</span><span>Matches</span>
    </button>
    <button class="nav-item" onclick="nav('tab-standings', this)">
        <span class="nav-icon">🏆</span><span>Standings</span>
    </button>
</nav>

<script>
const KEY = "tournamentx_v5_pro_rr_light";
let state = { name: "My Tournament", format: "rr", players: [], matches: [], stage: "setup" };

function uid() { return Math.random().toString(36).substr(2, 9); }
function esc(x) { return String(x || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m])); }

function getRankBadge(index) {
    let rank = index + 1;
    if (rank === 1) return `<span class="rank-circle rank-1">1</span>`;
    if (rank === 2) return `<span class="rank-circle rank-2">2</span>`;
    if (rank === 3) return `<span class="rank-circle rank-3">3</span>`;
    return `${rank}`;
}

function syncName() {
    const nameInp = document.getElementById("nameInput");
    if (nameInp && nameInp.value.trim()) {
        state.name = nameInp.value.trim();
    }
}

function save() { 
    localStorage.setItem(KEY, JSON.stringify(state)); 
}

function load() { try { let x = JSON.parse(localStorage.getItem(KEY)); if (x) state = { ...state, ...x }; } catch (e) {} }

function nav(id, btn) {
    syncName();
    document.querySelectorAll("body > .app > section").forEach(x => x.classList.add("hidden"));
    document.getElementById(id).classList.remove("hidden");
    document.querySelectorAll(".nav-item").forEach(x => x.classList.remove("active"));
    if(btn) btn.classList.add("active");
    render();
}

function addPlayer() {
    syncName();
    let inp = document.getElementById("playerInput"), name = inp.value.trim();
    if (!name) return;
    if (state.matches.length) {
        if (!confirm("Adding a player will reset active match progress. Continue?")) return;
        state.matches = [];
    }
    state.players.push({ id: uid(), name, played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 });
    inp.value = ""; save(); render();
}
document.getElementById("playerInput").addEventListener("keydown", e => e.key === "Enter" && addPlayer());

function removePlayer(id) {
    syncName();
    if (state.matches.length) {
        if (!confirm("Removing a player will reset active match progress. Continue?")) return;
        state.matches = [];
    }
    state.players = state.players.filter(p => p.id !== id);
    save(); render();
}

function resetStats() { state.players.forEach(p => Object.assign(p, { played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 })); }
function apply(m) {
    let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
    if (!a || !b) return;
    a.played++; b.played++; a.gf += m.s1; a.ga += m.s2; b.gf += m.s2; b.ga += m.s1;
    if (m.s1 > m.s2) { a.wins++; a.points += 3; b.losses++; } 
    else if (m.s2 > m.s1) { b.wins++; b.points += 3; a.losses++; } 
    else { a.draws++; b.draws++; a.points++; b.points++; }
}
function unapply(m) {
    let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
    if (!a || !b) return;
    a.played--; b.played--; a.gf -= m.s1; a.ga -= m.s2; b.gf -= m.s2; b.ga -= m.s1;
    if (m.s1 > m.s2) { a.wins--; a.points -= 3; b.losses--; } 
    else if (m.s2 > m.s1) { b.wins--; b.points -= 3; a.losses--; } 
    else { a.draws--; b.draws--; a.points--; b.points--; }
}

function rrMatches(ids) {
    let arr = [...ids]; if (arr.length % 2) arr.push(null);
    let out = [], rounds = arr.length - 1;
    for (let r = 1; r <= rounds; r++) {
        for (let i = 0; i < arr.length / 2; i++) {
            let a = arr[i], b = arr[arr.length - 1 - i];
            if (a && b) out.push({ id: uid(), round: r, p1: a, p2: b, s1: null, s2: null, done: false });
        }
        arr = [arr[0], arr[arr.length - 1], ...arr.slice(1, arr.length - 1)];
    }
    return out;
}

function generate() {
    if (state.players.length < 2) return alert("Please add at least 2 players to start.");
    if (state.matches.length && !confirm("Generate new matches and overwrite existing progress?")) return;
    
    syncName();
    state.format = "rr";
    state.matches = []; resetStats();

    state.matches = rrMatches(state.players.map(p => p.id));
    save(); nav('tab-matches', document.querySelectorAll('.nav-item')[1]);
}

function score(id) {
    let m = state.matches.find(x => x.id === id);
    if (!m) return;
    let input1 = document.getElementById("a" + id);
    let input2 = document.getElementById("b" + id);
    if (!input1 || !input2 || input1.value === "" || input2.value === "") return alert("Enter both scores.");
    
    let s1 = +input1.value, s2 = +input2.value;

    if (m.done) unapply(m);
    m.s1 = s1; m.s2 = s2; m.done = true;
    
    apply(m);
    
    save(); render();
}

function sorted() { 
    return [...state.players].sort((a, b) => 
        b.points - a.points || 
        (b.gf - b.ga) - (a.gf - a.ga) || 
        b.gf - a.gf || 
        a.name.localeCompare(b.name)
    ); 
}

function renderMatch(m) {
    let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
    if (!a && !b) return "";
    let res = m.done ? (m.s1 === m.s2 ? "Draw" : `${(m.s1 > m.s2 ? a : b)?.name || 'Winner'} Won`) : "";
    
    return `<div class="match-card">
        <div class="match-header"><span>Round ${m.round}</span><span>${m.done ? "✅" : "⏳"}</span></div>
        <div class="match-row">
            <div class="team">${esc(a ? a.name : 'BYE')}</div>
            <div class="score-inputs">
                <input id="a${m.id}" type="number" inputmode="numeric" value="${m.s1 ?? ""}">
                <span>-</span>
                <input id="b${m.id}" type="number" inputmode="numeric" value="${m.s2 ?? ""}">
            </div>
            <div class="team">${esc(b ? b.name : 'BYE')}</div>
        </div>
        <button class="btn secondary" style="margin-top:12px" onclick="score('${m.id}')">Save Score</button>
        ${res ? `<div class="result-badge">${res}</div>` : ""}
    </div>`;
}

function buildTableHTML(playerList) {
    return `<div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Player</th>
                    <th>G</th>
                    <th>W–T–L</th>
                    <th>GD</th>
                    <th>P</th>
                </tr>
            </thead>
            <tbody>
                ${playerList.map((p, i) => {
                    let gd = p.gf - p.ga;
                    let gdClass = gd > 0 ? 'positive-gd' : (gd < 0 ? 'negative-gd' : '');
                    let gdStr = gd > 0 ? `+${gd}` : gd;
                    let recordStr = `${p.wins}-${p.draws}-${p.losses}`;
                    return `<tr>
                        <td>${getRankBadge(i)}</td>
                        <td>${esc(p.name)}</td>
                        <td>${p.played}/${p.played}</td>
                        <td>${recordStr}</td>
                        <td class="${gdClass}">${gdStr}</td>
                        <td><b>${p.points}</b></td>
                    </tr>`;
                }).join("")}
            </tbody>
        </table>
    </div>`;
}

function render() {
    document.getElementById("nameInput").value = state.name || "";
    document.getElementById("nameInput").oninput = syncName;

    document.getElementById("playerCount").textContent = `${state.players.length} Players`;
    document.getElementById("playersArea").innerHTML = state.players.map(p => 
        `<div class="list-item"><span class="player-name">${esc(p.name)}</span><button class="btn-icon" onclick="removePlayer('${p.id}')">×</button></div>`
    ).join("") || '<div class="empty-state">No players added yet. Add players above.</div>';

    document.getElementById("matchesArea").innerHTML = state.matches.length ? state.matches.map(m => renderMatch(m)).join("") : '<div class="empty-state panel">Add players & click "Generate Tournament" on the Setup page to view matches.</div>';

    const stdWrap = document.getElementById("standingsArea");
    stdWrap.innerHTML = buildTableHTML(sorted());
}

function generateGraphicImage(title, items, filename, isStandings = false, playerList = []) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const width = 850;
    const padding = 40;
    const itemHeight = 44;
    const height = 180 + (items.length * itemHeight);

    canvas.width = width;
    canvas.height = height;

    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, "#f8fafc");
    grad.addColorStop(1, "#f1f5f9");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = "#d97706";
    ctx.font = "bold 28px sans-serif";
    ctx.fillText(state.name || "TournamentX", padding, 60);

    ctx.fillStyle = "#64748b";
    ctx.font = "16px sans-serif";
    ctx.fillText(title, padding, 90);

    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding, 110);
    ctx.lineTo(width - padding, 110);
    ctx.stroke();

    if (isStandings) {
        ctx.fillStyle = "#64748b";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText("#", padding + 15, 138);
        ctx.fillText("Player", padding + 70, 138);
        ctx.textAlign = "right";
        ctx.fillText("G", width - padding - 310, 138);
        ctx.fillText("W-T-L", width - padding - 210, 138);
        ctx.fillText("GD", width - padding - 110, 138);
        ctx.fillText("P", width - padding - 20, 138);
        ctx.textAlign = "left";

        ctx.beginPath();
        ctx.moveTo(padding, 150);
        ctx.lineTo(width - padding, 150);
        ctx.stroke();
    }

    let y = isStandings ? 185 : 150;
    items.forEach((item, index) => {
        ctx.fillStyle = index % 2 === 0 ? "#ffffff" : "#e2e8f0";
        if (ctx.roundRect) {
            ctx.beginPath();
            ctx.roundRect(padding, y - 28, width - (padding * 2), 36, 8);
            ctx.fill();
        } else {
            ctx.fillRect(padding, y - 28, width - (padding * 2), 36);
        }

        if (isStandings) {
            let rank = index + 1;
            let badgeColor = rank === 1 ? "#eab308" : (rank === 2 ? "#94a3b8" : (rank === 3 ? "#f97316" : "#64748b"));
            if (rank <= 3) {
                ctx.fillStyle = badgeColor;
                ctx.beginPath();
                ctx.arc(padding + 22, y - 10, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(rank, padding + 22, y - 5);
                ctx.textAlign = "left";
            } else {
                ctx.fillStyle = "#0f172a";
                ctx.font = "14px sans-serif";
                ctx.fillText(rank, padding + 18, y - 5);
            }

            ctx.fillStyle = "#0f172a";
            ctx.font = "bold 14px sans-serif";
            ctx.fillText(item.name, padding + 70, y - 5);

            ctx.fillStyle = "#0f172a";
            ctx.font = "14px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(item.played, width - padding - 310, y - 5);
            ctx.fillText(item.record, width - padding - 210, y - 5);
            ctx.fillText(item.gd, width - padding - 110, y - 5);
            ctx.font = "bold 15px sans-serif";
            ctx.fillText(item.points, width - padding - 20, y - 5);
            ctx.textAlign = "left";
        } else {
            ctx.fillStyle = "#0f172a";
            ctx.font = "15px sans-serif";
            ctx.fillText(item.left, padding + 15, y);

            ctx.fillStyle = "#2563eb";
            ctx.font = "bold 15px monospace";
            ctx.textAlign = "right";
            ctx.fillText(item.right, width - padding - 15, y);
            ctx.textAlign = "left";
        }

        y += itemHeight;
    });

    const link = document.createElement("a");
    link.download = filename;
    link.href = canvas.toDataURL("image/png");
    link.click();
}

function exportMatchesAsImage() {
    if (!state.matches.length) return alert("No matches available to export.");

    let items = state.matches.map(m => {
        let a = state.players.find(p => p.id === m.p1), b = state.players.find(p => p.id === m.p2);
        let scoreText = m.done ? `${m.s1} - ${m.s2}` : "VS (Pending)";
        return { left: `Round ${m.round}: ${a?.name || "TBD"} vs ${b?.name || "TBD"}`, right: scoreText };
    });

    generateGraphicImage("Match Results", items, `${state.name.replace(/\s+/g, '_')}_Matches.png`, false);
}

function exportStandingsAsImage() {
    let arr = sorted();
    if (!arr.length) return alert("No standings data available.");

    let items = arr.map((p, i) => {
        let gd = p.gf - p.ga;
        let gdStr = gd > 0 ? `+${gd}` : gd;
        return {
            name: p.name,
            played: `${p.played}/${p.played}`,
            record: `${p.wins}-${p.draws}-${p.losses}`,
            gd: gdStr,
            points: p.points
        };
    });

    generateGraphicImage("Standings & Leaderboard", items, `${state.name.replace(/\s+/g, '_')}_Standings.png`, true, arr);
}

load(); render();
</script>
</body>
</html>
